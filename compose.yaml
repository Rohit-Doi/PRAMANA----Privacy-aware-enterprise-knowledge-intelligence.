# PRAMĀṆA v2
#
#   docker compose up -d                    datastores only (about 2 GB RAM); run the API and the
#                                           web app on the host — the normal way to develop
#   docker compose --profile app up -d      everything in containers (about 7 GB RAM in total)
#
# Ports bind to 127.0.0.1 only. Credentials come from .env (see scripts/init_env.py).
name: pramana2

services:
  postgres:
    image: postgres:16-alpine
    container_name: pramana2-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pramana}
      POSTGRES_USER: ${POSTGRES_USER:-pramana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init_env.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pramana} -d ${POSTGRES_DB:-pramana}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pramana2-redis
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: pramana2-qdrant
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 640m
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: pramana2-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?run scripts/init_env.py first}
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 192m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1100m
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.21.1
    container_name: pramana2-opa
    # Policies and data are pushed by the backend at startup (see pramana.privacy.policy),
    # so every decision can be tied to a stored policy version.
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-format=json", "--log-level=error"]
    ports:
      - "127.0.0.1:${OPA_PORT:-8181}:8181"
    mem_limit: 128m
    restart: unless-stopped

  # ── Application (profile "app") ───────────────────────────────────────────
  # First run, in order:
  #   docker compose --profile app run --rm setup     migrate the database, seed roles and personas
  #   docker compose --profile app run --rm models    download the local models (about 2 GB, once)
  #   docker compose --profile app up -d
  setup:
    profiles: ["app"]
    build: &backend_build
      context: .
      dockerfile: backend/Dockerfile
    image: pramana-backend:local
    env_file: .env
    environment: &backend_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      OPA_URL: http://opa:8181
    command: ["sh", "-c", "alembic upgrade head && python /app/scripts/seed.py"]
    depends_on: &backend_depends
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      qdrant: { condition: service_started }
      opa: { condition: service_started }
    restart: "no"

  models:
    profiles: ["app"]
    image: pramana-backend:local
    env_file: .env
    environment: *backend_env
    command: ["python", "/app/scripts/download_models.py"]
    volumes:
      - model_cache:/app/.cache
    restart: "no"

  api:
    profiles: ["app"]
    build: *backend_build
    image: pramana-backend:local
    container_name: pramana2-api
    env_file: .env
    environment:
      <<: *backend_env
      EMBEDDED_WORKER: "false"   # ingestion runs in the worker service below
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - model_cache:/app/.cache
      - document_storage:/app/data
    depends_on: *backend_depends
    mem_limit: 3g
    restart: unless-stopped

  worker:
    profiles: ["app"]
    image: pramana-backend:local
    container_name: pramana2-worker
    env_file: .env
    environment: *backend_env
    command: ["python", "-m", "pramana.worker"]
    volumes:
      - model_cache:/app/.cache
      - document_storage:/app/data
    depends_on: *backend_depends
    mem_limit: 3g
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    image: pramana-web:local
    container_name: pramana2-web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  model_cache:
  document_storage:
